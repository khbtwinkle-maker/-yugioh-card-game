<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>듀얼 아레나</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="game">

  <div id="opponent-area" class="player-area">
    <div class="side-info">
      <div class="lp-display">
        <span class="player-name">상대</span>
        <span class="lp-value" id="ai-lp">4000</span>
        <div class="lp-bar"><div class="lp-bar-fill" id="ai-lp-bar"></div></div>
      </div>
      <div class="deck-info">덱: <span id="ai-deck-count">86</span>장</div>
    </div>
    <div class="field" id="ai-field"></div>
    <div class="field spell-field" id="ai-spell-field"></div>
    <div class="hand" id="ai-hand"></div>
  </div>

  <div id="center-area">
    <div id="status-row">
      <div id="turn-indicator">내 턴</div>
      <div id="phase-indicator">메인 페이즈</div>
    </div>
    <div id="controls">
      <button id="next-phase-btn">배틀 페이즈로</button>
      <button id="end-turn-btn">턴 종료</button>
    </div>
    <div id="hand-actions"></div>
    <div id="inspect-hint">카드를 우클릭하면 효과를 확인할 수 있습니다.</div>
    <div id="log"></div>
  </div>

  <div id="player-area" class="player-area">
    <div class="hand" id="player-hand"></div>
    <div class="field spell-field" id="player-spell-field"></div>
    <div class="field" id="player-field"></div>
    <div class="side-info">
      <div class="deck-info">덱: <span id="player-deck-count">86</span>장</div>
      <div class="lp-display">
        <span class="player-name">나</span>
        <span class="lp-value" id="player-lp">4000</span>
        <div class="lp-bar"><div class="lp-bar-fill" id="player-lp-bar"></div></div>
      </div>
    </div>
  </div>

</div>

<div id="game-over-overlay" class="hidden">
  <div id="game-over-box">
    <div id="game-over-message"></div>
    <button id="restart-btn">다시 하기</button>
  </div>
</div>

<div id="card-detail-overlay" class="hidden">
  <div id="card-detail-box">
    <button id="card-detail-close" type="button" aria-label="닫기">×</button>
    <div id="card-detail-art"></div>
    <div id="card-detail-emoji"></div>
    <div id="card-detail-name"></div>
    <div id="card-detail-meta"></div>
    <div id="card-detail-desc"></div>
  </div>
</div>

<script src="cards.js"></script>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="script.js"></script>
</body>
</html>
